name: build production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: blog-production-deploy
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            swistakcodes/blog:latest
            swistakcodes/blog:prod-${{ github.sha }}
          build-args: |
            HIDE=true
            URL=https://swistak.codes
            MATOMO_URL=https://radioactive-toy.swistak.codes
            MATOMO_ID=1
            PUBLIC_SEARCH_HOST=dont-hate-me.swistak.codes
            PUBLIC_SEARCH_PORT=443
            PUBLIC_SEARCH_PROTOCOL=https
            NEXT_ASSET_PREFIX=https://lightbulb-sun.swistak.codes/prod
            NEXT_IMAGE_PATH=https://lightbulb-sun.swistak.codes/prod/_next/image

  assets:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Next.js static assets
        env:
          IMAGE: swistakcodes/blog@${{ needs.docker.outputs.image_digest }}
        run: |
          set -euo pipefail

          docker pull "$IMAGE"

          container_id="$(docker create "$IMAGE")"

          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          rm -rf .bunny-static
          mkdir -p .bunny-static
          rm -rf .bunny-og
          mkdir -p .bunny-og

          docker cp \
            "$container_id:/app/.next/static/." \
            .bunny-static/
          docker cp \
            "$container_id:/app/.next/og/." \
            .bunny-og/

          test -n "$(find .bunny-static -type f -print -quit)"
          test -n "$(find .bunny-og -type f -print -quit)"

      - name: Upload assets to Bunny
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          BUNNY_UPLOAD_CONCURRENCY: 8
        run: |
          node tools/cdn/upload-to-bunny.mjs \
            .bunny-static \
            prod/_next/static

      - name: Upload Open Graph images to Bunny
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          BUNNY_UPLOAD_CONCURRENCY: 8
        run: |
          node tools/cdn/upload-to-bunny.mjs \
            .bunny-og \
            prod/og

  deploy:
    runs-on: ubuntu-latest
    needs: assets

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/staging.key
          chmod 600 ~/.ssh/staging.key

          cat >> ~/.ssh/config <<END
          Host staging
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/staging.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Restart container on server
        run: ssh staging './start.sh blog'
